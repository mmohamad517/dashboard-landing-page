name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # Served from the custom domain at the root (public/CNAME), so the
        # defaults in astro.config.mjs apply: base "/" and the
        # bestoutdoorwears.com canonical. To go back to the github.io
        # project-site URL, delete public/CNAME and restore:
        #   env:
        #     PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        #     PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enables GitHub Pages via the API if it isn't already turned on
          # in the repository settings, so the first deploy works unattended.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
